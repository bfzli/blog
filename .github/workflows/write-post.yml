name: Write post

on:
    schedule:
        - cron: '0 7 * * *'
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

jobs:
    write:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run posts:write
              env:
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

            - run: npm run www:build

            - uses: peter-evans/create-pull-request@v7
              with:
                  branch: content/daily-post
                  title: 'content: new draft post'
                  body: Generated from the next queued idea. Read it before merging, and reject it if it reads generic.
                  commit-message: 'content: add generated draft'
                  add-paths: |
                      src/content/posts
                      scripts/queue.json
                  delete-branch: true
