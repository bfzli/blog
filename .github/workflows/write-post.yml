name: Write post

on:
    schedule:
        - cron: '0 22 * * *'
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write
    issues: write

# queue.json is written by both this workflow and the planner. Serialize them so
# neither can plan or consume against a stale copy.
concurrency:
    group: posts-pipeline
    cancel-in-progress: false

env:
    HUSKY: 0

jobs:
    write:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run posts:write
              env:
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

            - run: npm run web:build

            - name: Set the advanced queue aside
              run: cp scripts/queue.json "$RUNNER_TEMP/queue.json"

            - uses: peter-evans/create-pull-request@v7
              id: draft
              with:
                  branch: content/post-${{ github.run_number }}
                  title: 'content: new draft post'
                  body: |
                      Generated from the next queued idea. Read it before merging, and reject it if it reads generic.

                      Closing this without merging does not lose the idea: it stays in the `drafted` array of `scripts/queue.json`. Delete its entry there to let the planner pick that problem up again.
                  commit-message: 'content: add generated draft'
                  add-paths: src/content/posts
                  delete-branch: true

            # Only move the idea into `drafted` once the draft is safely in a PR.
            # If the step above fails the queue is untouched and tomorrow retries.
            - name: Advance the queue on the base branch
              if: steps.draft.outputs.pull-request-number != ''
              run: |
                  git fetch origin "$GITHUB_REF_NAME"
                  git checkout -f -B "$GITHUB_REF_NAME" "origin/$GITHUB_REF_NAME"
                  cp "$RUNNER_TEMP/queue.json" scripts/queue.json
                  if git diff --quiet -- scripts/queue.json; then
                      echo 'Queue unchanged, nothing to advance'
                      exit 0
                  fi
                  git config user.name 'github-actions[bot]'
                  git config user.email 'github-actions[bot]@users.noreply.github.com'
                  git add scripts/queue.json
                  git commit -m 'content: consume queued idea'
                  git push

            # A green run that produced no PR is a stalled pipeline, not a healthy
            # one. That ambiguity is what hid the outage for five days.
            - name: Fail if no draft was opened
              if: steps.draft.outputs.pull-request-number == ''
              run: |
                  echo '::error::No draft PR was created, this run produced nothing'
                  exit 1

            - name: Report failure
              if: failure()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  title='Post pipeline is failing'
                  run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                  body="\`$GITHUB_WORKFLOW\` failed. Run: $run_url"
                  existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
                  if [ -n "$existing" ]; then
                      gh issue comment "$existing" --body "$body"
                  else
                      gh issue create --title "$title" --body "$body"
                  fi
