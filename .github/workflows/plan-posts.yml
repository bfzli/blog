name: Plan posts

on:
    schedule:
        - cron: '0 22 * * 0'
    workflow_dispatch:

permissions:
    contents: write
    pull-requests: write

env:
    HUSKY: 0

jobs:
    plan:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run posts:plan
              env:
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

            - uses: peter-evans/create-pull-request@v7
              with:
                  branch: content/weekly-plan
                  title: 'content: weekly post ideas'
                  body: Seven queued ideas for the coming week. Edit or delete any of them before merging.
                  commit-message: 'content: refresh the post queue'
                  add-paths: scripts/queue.json
                  delete-branch: true
