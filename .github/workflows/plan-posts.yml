name: Plan posts

on:
    schedule:
        - cron: '0 20 * * 0'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: posts-pipeline
    cancel-in-progress: false

env:
    HUSKY: 0

jobs:
    plan:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run posts:plan
              env:
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

            - name: Push the refilled queue
              run: |
                  if git diff --quiet -- scripts/queue.json; then
                      echo 'Queue unchanged, nothing to push'
                      exit 0
                  fi
                  git config user.name 'github-actions[bot]'
                  git config user.email 'github-actions[bot]@users.noreply.github.com'
                  git add scripts/queue.json
                  git commit -m 'content: refresh the post queue'
                  git pull --rebase origin "$GITHUB_REF_NAME"
                  git push origin "HEAD:$GITHUB_REF_NAME"
