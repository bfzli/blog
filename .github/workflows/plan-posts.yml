name: Plan posts

on:
    # Two hours ahead of the daily writer so the Sunday runs never overlap.
    schedule:
        - cron: '0 20 * * 0'
    workflow_dispatch:

permissions:
    contents: write
    issues: write

# queue.json is written by both this workflow and the writer. Serialize them so
# neither can plan or consume against a stale copy.
concurrency:
    group: posts-pipeline
    cancel-in-progress: false

env:
    HUSKY: 0

jobs:
    plan:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: npm

            - run: npm ci

            - run: npm run posts:plan
              env:
                  OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

            # The queue is machine state, not content. Routing it through a PR
            # meant an unmerged plan starved the writer, which is what emptied
            # the queue in August. Posts still go through review; this does not.
            - name: Push the refilled queue
              run: |
                  if git diff --quiet -- scripts/queue.json; then
                      echo 'Queue unchanged, nothing to push'
                      exit 0
                  fi
                  git config user.name 'github-actions[bot]'
                  git config user.email 'github-actions[bot]@users.noreply.github.com'
                  git add scripts/queue.json
                  git commit -m 'content: refresh the post queue'
                  git pull --rebase origin "$GITHUB_REF_NAME"
                  git push origin "HEAD:$GITHUB_REF_NAME"

            - name: Report failure
              if: failure()
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
                  echo "::error::$GITHUB_WORKFLOW failed. $run_url"

                  # The tracking issue needs Issues enabled on the repository. If
                  # they are off, fall back to the annotation above rather than
                  # failing this step and burying why the run actually broke.
                  if [ "$(gh api "repos/$GITHUB_REPOSITORY" --jq '.has_issues')" != 'true' ]; then
                      echo 'Issues are disabled on this repository, no tracking issue created'
                      exit 0
                  fi

                  title='Post pipeline is failing'
                  body="\`$GITHUB_WORKFLOW\` failed. Run: $run_url"
                  existing=$(gh issue list --state open --search "$title in:title" --json number --jq '.[0].number // empty')
                  if [ -n "$existing" ]; then
                      gh issue comment "$existing" --body "$body"
                  else
                      gh issue create --title "$title" --body "$body"
                  fi
